name: Add new issues to Biopeia Project 1

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-project:
    uses: biopeia/.github-private/.github/workflows/project-1-auto-add-issue.yml@31ff6878d9a6b7361a332a2dff815f38da3c013c
    with:
      app_id: ${{ vars.PROJECT_1_INTAKE_APP_ID }}
      project_id: ${{ vars.PROJECT_1_NODE_ID }}
    secrets:
      app_private_key: ${{ secrets.PROJECT_1_INTAKE_APP_PRIVATE_KEY }}
