name: Add new issues to Biopeia Project 1

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-project:
    uses: biopeia/.github/.github/workflows/project-1-auto-add-issue.yml@671b13855d48ea9ec5a81044f05b416ea2cbfd24
    with:
      app_id: ${{ vars.PROJECT_1_INTAKE_APP_ID }}
      project_id: ${{ vars.PROJECT_1_NODE_ID }}
    secrets:
      app_private_key: ${{ secrets.PROJECT_1_INTAKE_APP_PRIVATE_KEY }}
