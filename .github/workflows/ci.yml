name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest

  # Verifies World's coordination at the exact revisions in uv.lock.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Public source repositories allow anonymous read access. uv.lock records
      # the exact dependency revisions used for the integration evidence.
      - name: Install locked integration dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra integration
      - run: uv run --no-sync python -m pytest tests/integration

