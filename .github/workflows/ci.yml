name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest

  # Verifies World's coordination of the other authorities at the revisions
  # pinned in the integration extra.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # All integration dependencies are pinned in pyproject.toml and their
      # source repositories are public. Anonymous read access keeps this
      # required check runnable for Dependabot without granting credentials.
      - name: Install with the pinned integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[integration]'
      - run: python -m pytest tests/integration

