[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world"
version = "0.1.0"
description = "World causal coordination primitives for Biopeia"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]
# Cross-repository integration tests only. The package itself has no runtime
# dependency on any other Biopeia repository. Each pin is the exact revision
# the tests under tests/integration were verified against.
integration = [
    "pytest>=8",
    "mujoco==3.14.0",
    "organism @ git+https://github.com/biopeia/organism.git@d1adf081333acd15c0252df84d498a7ba9e276ad",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@6114f3d9bcc0d5c44ecbfb6262f87f5824f92903",
    "environment @ git+https://github.com/biopeia/environment.git@0a9f4fbb1922cc6ca9e7b2489cf891606ef9ee41",
    "observation @ git+https://github.com/biopeia/observation.git@be82907d1d677b2362e369d15eb1e8e964d893aa",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs the other Biopeia packages; run it explicitly with
# `python -m pytest tests/integration` after installing the integration extra.
norecursedirs = ["integration"]
