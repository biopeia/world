[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world"
version = "0.1.0"
description = "World causal coordination primitives for Biopeia"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Cross-repository integration tests only. The package itself has no runtime
# dependency on any other Biopeia repository. Each pin is the exact revision
# the tests under tests/integration were verified against.
integration = [
    "pytest>=8",
    "mujoco==3.14.0",
    "organism @ git+https://github.com/biopeia/organism.git@fc8a91c61d865663ba6f9468216171506fd29e7a",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@6f5fd9edb46c3a4557733df08149453f16bddb9f",
    "environment @ git+https://github.com/biopeia/environment.git@0a9f4fbb1922cc6ca9e7b2489cf891606ef9ee41",
    "observation @ git+https://github.com/biopeia/observation.git@186da664cdcb04d013fb2a359913bd9b2391e07e",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs the other Biopeia packages; run it explicitly with
# `python -m pytest tests/integration` after installing the integration extra.
norecursedirs = ["integration"]
