[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world"
version = "0.1.0"
description = "World causal coordination primitives for Biopeia"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]
# Production World -> Organism transition invocation. This remains optional so
# the causal runtime primitives can still be installed independently.
runtime = [
    "organism @ git+https://github.com/biopeia/organism.git@48726e7640ed3fbce15b792966f7082e3c9756ae",
]
# Cross-repository integration tests only. The package itself has no runtime
# dependency on other Biopeia repositories unless its optional runtime or
# integration capability is selected. Each pin is the exact revision the
# integration tests were verified against.
integration = [
    "pytest>=8",
    "mujoco==3.14.0",
    "organism @ git+https://github.com/biopeia/organism.git@48726e7640ed3fbce15b792966f7082e3c9756ae",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@b5714f985d0aa970d3a412a7d29e43fa0bcb89d6",
    "environment @ git+https://github.com/biopeia/environment.git@9812464ef2f2841b2984375738c8b5e8ee6da2dc",
    "modality @ git+https://github.com/biopeia/modality.git@79b779152d4bff2ab4191dc6601c8f1640e4cae3",
    "observation @ git+https://github.com/biopeia/observation.git@d786d914f3c9ccbf3e4e105c5691910de5059b03",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs the other Biopeia packages; run it explicitly with
# `python -m pytest tests/integration` after installing the integration extra.
norecursedirs = ["integration"]
