[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world"
version = "0.1.0"
description = "World causal coordination primitives for Biopeia"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]
# Production World orchestration across the sensor-to-Organism transition.
# This remains optional so World causal primitives can be installed alone.
runtime = [
    "organism @ git+https://github.com/biopeia/organism.git@a4960c28774aa3afc60b1caa1c8a640cca907de1",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@a4a665f9d62ef5c86ede5055040a24766f590a2d",
    "environment @ git+https://github.com/biopeia/environment.git@b71d5566c3a73774a088a41a7b99a03954e43a53",
    "modality @ git+https://github.com/biopeia/modality.git@79b779152d4bff2ab4191dc6601c8f1640e4cae3",
]
# Cross-repository integration tests only. The package itself has no runtime
# dependency on other Biopeia repositories unless its optional runtime or
# integration capability is selected. Each pin is the exact revision the
# integration tests were verified against.
integration = [
    "pytest>=8",
    "mujoco==3.14.0",
    "organism @ git+https://github.com/biopeia/organism.git@a4960c28774aa3afc60b1caa1c8a640cca907de1",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@a4a665f9d62ef5c86ede5055040a24766f590a2d",
    "environment @ git+https://github.com/biopeia/environment.git@b71d5566c3a73774a088a41a7b99a03954e43a53",
    "modality @ git+https://github.com/biopeia/modality.git@79b779152d4bff2ab4191dc6601c8f1640e4cae3",
    "observation @ git+https://github.com/biopeia/observation.git@ef6321d2bab43b883238cdcf0ce33c08321d595c",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs the other Biopeia packages; run it explicitly with
# `python -m pytest tests/integration` after installing the integration extra.
norecursedirs = ["integration"]
