[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world"
version = "0.1.0"
description = "World causal coordination primitives for Biopeia"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]
# Cross-repository integration tests only. The package itself has no runtime
# dependency on any other Biopeia repository. Each pin is the exact revision
# the tests under tests/integration were verified against.
integration = [
    "pytest>=8",
    "mujoco==3.14.0",
    "organism @ git+https://github.com/biopeia/organism.git@8bf1eafeb2c05459e4cbaae3a377d2f1c35504c6",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@badf444f8f62e91d1c5ed4a65f3fe23c6cbda6b8",
    "environment @ git+https://github.com/biopeia/environment.git@55f1940b43e128cf254e640201088f0c5fd2506f",
    "modality @ git+https://github.com/biopeia/modality.git@cc74103099f63353e94e1bcdaeeada35a0b571fd",
    "observation @ git+https://github.com/biopeia/observation.git@be82907d1d677b2362e369d15eb1e8e964d893aa",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs the other Biopeia packages; run it explicitly with
# `python -m pytest tests/integration` after installing the integration extra.
norecursedirs = ["integration"]
