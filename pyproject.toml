[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world"
version = "0.1.0"
description = "World causal coordination primitives for Biopeia"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
world-m1 = "world.m1_process:main"

[project.optional-dependencies]
mujoco = ["mujoco==3.15.0"]
# Production World orchestration across the sensor-to-Organism transition.
# This remains optional so World causal primitives can be installed alone.
runtime = [
    "organism @ git+https://github.com/biopeia/organism.git@main",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@15347cf5522e92e49cb8b1fa4cba28235032e053",
    "environment @ git+https://github.com/biopeia/environment.git@main",
    "modality @ git+https://github.com/biopeia/modality.git@main",
    "observation @ git+https://github.com/biopeia/observation.git@main",
]
# Cross-repository integration tests only. The uv lockfile records exact
# resolved revisions; runtime admission remains interface/capability based.
integration = [
    "pytest>=8",
    "mujoco==3.15.0",
    "organism @ git+https://github.com/biopeia/organism.git@main",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@15347cf5522e92e49cb8b1fa4cba28235032e053",
    "environment @ git+https://github.com/biopeia/environment.git@main",
    "modality @ git+https://github.com/biopeia/modality.git@main",
    "observation @ git+https://github.com/biopeia/observation.git@main",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs the other Biopeia packages; run it explicitly with
# `python -m pytest tests/integration` after installing the integration extra.
norecursedirs = ["integration"]
