[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world"
version = "0.1.0"
description = "World causal coordination primitives for Biopeia"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]
# Cross-repository integration tests only. The package itself has no runtime
# dependency on any other Biopeia repository. Each pin is the exact revision
# the tests under tests/integration were verified against.
integration = [
    "pytest>=8",
    "mujoco==3.14.0",
    "organism @ git+https://github.com/biopeia/organism.git@ba0011797a6a3b4d48c7731651e50560c4043f18",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@597cc4a09f4a5c94095b17ad0f2ba510df6d02c3",
    "environment @ git+https://github.com/biopeia/environment.git@caa885a11ec0170717bb4b71d271ab171807197e",
    "modality @ git+https://github.com/biopeia/modality.git@79b779152d4bff2ab4191dc6601c8f1640e4cae3",
    "observation @ git+https://github.com/biopeia/observation.git@6aac3c76684834722440f53c9d8604ac4c16b138",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs the other Biopeia packages; run it explicitly with
# `python -m pytest tests/integration` after installing the integration extra.
norecursedirs = ["integration"]
